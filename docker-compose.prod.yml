# /home/siisi-site/e-commerce/docker-compose.prod.yml

services:
  ecommerce:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - gunicorn
      - ecommerce.wsgi:application
      - --bind
      - 0.0.0.0:8005
      - --log-level=debug
      - --access-logfile=/var/log/siisi/e-commerce/logs/e-commerce.log
      - --error-logfile=/var/log/siisi/e-commerce/logs/e-commerce.log
    environment:
      - ENVIRONMENT=prod
    volumes:
      - ./logs:/var/log/siisi/e-commerce/logs
      - ./media:/app/media
    env_file:
      - .env.prod
    ports:
      - "8005:8005"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
